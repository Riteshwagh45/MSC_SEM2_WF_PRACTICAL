<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Registration Form</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h3 class="text-center mb-4">Employee Registration</h3>

        <form id="employeeForm" onsubmit="return validateForm()">

        
            <div class="mb-3">
                <label class="form-label">Employee Number</label>
                <input type="number" id="empNo" class="form-control">
                <small class="error" id="empNoError"></small>
            </div>

            
            <div class="mb-3">
                <label class="form-label">Employee Name</label>
                <input type="text" id="empName" class="form-control">
                <small class="error" id="empNameError"></small>
            </div>

        
            <div class="mb-3">
                <label class="form-label">Salary</label>
                <input type="number" id="salary" class="form-control">
                <small class="error" id="salaryError"></small>
            </div>

        
            <div class="mb-3">
                <label class="form-label">Date of Birth</label>
                <input type="date" id="dob" class="form-control">
                <small class="error" id="dobError"></small>
            </div>

            
            <div class="mb-3">
                <label class="form-label">Joining Date</label>
                <input type="date" id="joiningDate" class="form-control">
                <small class="error" id="joiningError"></small>
            </div>

            
            <div class="text-center">
                <button type="submit" class="btn btn-success">Register</button>
            </div>

    
            <p class="success text-center mt-3" id="successMsg"></p>

        </form>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


<script src="script.js"></script>

</body>
</html>
